<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trân & Huy Wedding</title>

<style>
body {
  margin:0;
  font-family: 'Segoe UI', sans-serif;
  text-align:center;
  background:#fffafc;
  color:#333;
}

.hero {
  padding:60px 20px;
}

h1 {
  font-size:40px;
}

.heart {
  color:#e25555;
}

.section {
  padding:40px 20px;
}

img {
  width:90%;
  border-radius:16px;
  margin:15px 0;
}

.map {
  margin-top:20px;
}

iframe {
  width:90%;
  height:300px;
  border:0;
  border-radius:12px;
}

audio {
  position:fixed;
  bottom:10px;
  left:10px;
}
</style>
</head>

<body>

<div class="hero">
  <h1>Minh Trân <span class="heart">❤</span> Đức Huy</h1>
  <p>09.05.2026 - 18:00</p>
  <p>Nhà hàng Pavillon Tân Sơn Nhất</p>
</div>

<div class="section">
  <h2>💌 Trân trọng kính mời</h2>
  <p>Đến chung vui cùng chúng tôi trong ngày trọng đại</p>
</div>

<div class="section">
  <h2>📸 Khoảnh khắc</h2>
  <img src="photo1.jpg">
  <img src="photo2.jpg">
</div>

<div class="section map">
  <h2>📍 Địa điểm</h2>
  <iframe src="https://www.google.com/maps?q=202+Hoang+Van+Thu+Phu+Nhuan+HCM&output=embed"></iframe>
</div>

<audio controls autoplay loop>
  <source src="music.mp3" type="audio/mpeg">
</audio>

</body>
</html>
